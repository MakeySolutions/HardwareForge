name: Release

# Spusti sa po pushnuti tagu, napr.:  git tag v0.1.0 && git push origin v0.1.0
# Vytvori KONCEPT (draft) vydania - zverejni ho clovek jednym klikom na GitHube.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Audit produkčných závislostí
        run: npm audit --omit=dev --audit-level=high

      - name: Build inštalátora
        run: npm run dist
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: SHA-256 kontrolné súčty
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Out-File release/SHA256SUMS.txt -Encoding ascii
          Get-Content release/SHA256SUMS.txt

      - name: Koncept vydania
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release/*.exe
            release/SHA256SUMS.txt
